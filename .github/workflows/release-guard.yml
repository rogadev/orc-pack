name: Release guard

# Plugin users only receive updates when .claude-plugin/plugin.json's version
# changes, so nothing ships until that field moves. This guard runs on PRs into
# main (the dev -> main flow) and, as a safety net, on direct pushes to main:
#
#   1. If skills/ or agents/ changed without a version bump, bump the patch
#      version in plugin.json.
#   2. Sync every per-file `pack: orc-pack@x.y.z` marker to the manifest.
#   3. Run Prettier over the repo.
#   4. Commit and push the fixes to the branch under review, so the merge
#      proceeds with them included.
#   5. Require a CHANGELOG.md section for the final version. This runs on PRs
#      into main too, so a missing update map is caught before merge.
#   6. On main only: if no `vX.Y.Z` tag exists for the final version, tag it and
#      publish a GitHub release whose body is that changelog section verbatim.
#      This is what turns "the version changed" into a visible release, and the
#      release body is the update map `/update-orc` reads.
#
# Anything that can't be auto-fixed (for example a file Prettier can't parse)
# fails the job: red check, no merge until it's fixed. Pushes made by the bot
# use GITHUB_TOKEN and don't retrigger workflows, so there is no loop.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-guard-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    # Skip bot pushes (loop guard) and fork PRs: the auto-fix push needs write
    # access to the head branch, and running this job against branches from
    # outside the repo would execute the guard over untrusted content while
    # holding a write token. Same-repo branches already require write access.
    if: >-
      github.actor != 'github-actions[bot]' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          fetch-depth: 0

      - name: Bump version if pack content changed without one
        # Event context enters the script only through env, never inline
        # ${{ }} interpolation — branch names and event fields are data here,
        # not shell source.
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE=$(git merge-base HEAD "origin/$BASE_REF")
          else
            BASE="$BEFORE_SHA"
            if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
              BASE=$(git rev-parse HEAD^)
            fi
          fi

          NEW_VER=$(jq -r .version .claude-plugin/plugin.json)
          if ! [[ "$NEW_VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::plugin.json version '$NEW_VER' is not a plain x.y.z version"
            exit 1
          fi
          BASE_VER=$(git show "$BASE:.claude-plugin/plugin.json" 2>/dev/null | jq -r .version || echo "")
          CONTENT_CHANGED=$(git diff --name-only "$BASE" HEAD -- skills agents | head -1)

          if [ -n "$CONTENT_CHANGED" ] && [ "$NEW_VER" = "$BASE_VER" ]; then
            IFS=. read -r MAJ MIN PAT <<< "$NEW_VER"
            NEW_VER="$MAJ.$MIN.$((PAT + 1))"
            jq --arg v "$NEW_VER" '.version = $v' .claude-plugin/plugin.json > plugin.json.tmp
            mv plugin.json.tmp .claude-plugin/plugin.json
            echo "Pack content changed without a version bump — auto-bumping to $NEW_VER"
          fi

          # NEW_VER is validated as ^[0-9]+\.[0-9]+\.[0-9]+$ above, so it is
          # safe to place inside the sed program.
          sed -i "s/^pack: orc-pack@.*/pack: orc-pack@$NEW_VER/" skills/*/SKILL.md agents/*.md
          echo "PACK_VERSION=$NEW_VER" >> "$GITHUB_ENV"

      - name: Format (fails the job on files Prettier cannot parse)
        run: npx --yes prettier@3 --write .

      - name: Commit and push fixes
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Version $PACK_VERSION consistent and formatting clean; nothing to do."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: version $PACK_VERSION — auto bump/sync and formatting"
          git push

      - name: Require a changelog entry for this version
        # Runs on PRs into main and on main itself, so a missing update map is
        # caught before merge, not after.
        run: |
          set -euo pipefail
          NOTES="$RUNNER_TEMP/release-notes.md"
          awk -v v="$PACK_VERSION" '
            index($0, "## [" v "]") == 1 { found = 1 }
            found && index($0, "## [") == 1 && index($0, "## [" v "]") != 1 { exit }
            found { print }
          ' CHANGELOG.md > "$NOTES"
          if [ ! -s "$NOTES" ]; then
            echo "::error::CHANGELOG.md has no '## [$PACK_VERSION]' section. Add one (format at the top of CHANGELOG.md) — a release with no update map does not publish."
            exit 1
          fi
          echo "RELEASE_NOTES=$NOTES" >> "$GITHUB_ENV"

      - name: Publish GitHub release for the current version
        # Only on main (push or manual run), never on the PR branch. Skips
        # silently when the tag already exists, so re-runs and no-op pushes
        # don't create duplicate releases.
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v$PACK_VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; nothing to publish."
            exit 0
          fi
          gh release create "$TAG" --target "$(git rev-parse HEAD)" --title "orc-pack $TAG" --notes-file "$RELEASE_NOTES"
          echo "Published release $TAG"
